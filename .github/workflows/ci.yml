name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --upgrade pip==26.2.1 setuptools==84.2.0
      - run: python -m pip install --disable-pip-version-check -c requirements.lock -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: python -m build
      - run: pip-audit
      - run: sudo install -d -m 700 /etc/memecoin-bot && sudo install -m 600 /dev/null /etc/memecoin-bot/bot.env
      - run: sudo docker compose config --no-env-resolution --quiet
      - run: docker build --tag memeops-paper:ci .
