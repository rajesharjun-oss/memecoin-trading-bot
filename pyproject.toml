[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "memecoin-trading-bot"
version = "0.1.0"
description = "Safe-by-default Solana token scanner and Jupiter Swap V2 executor"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
  "defusedxml==0.7.1",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "solders==0.29.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.8",
  "types-defusedxml==0.7.0.20260504",
]

[project.scripts]
memecoin-bot = "memecoin_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memecoin_bot"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/memecoin_bot",
  "tests",
  "deploy",
  "README.md",
  "pyproject.toml",
  ".env.example",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
